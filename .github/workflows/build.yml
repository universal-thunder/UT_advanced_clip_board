name: Windows release build
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'installer/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build application, installer and integration tests
        shell: powershell
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedClipboard-win-x64
          path: artifacts/dist/*
